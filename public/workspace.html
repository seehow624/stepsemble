<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Stepsemble · Workspace</title><link rel="icon" href="/icon-32.png?v=3.9.48"><link rel="stylesheet" href="/style.css?v=3.9.48"><link rel="stylesheet" href="/modules/agent-identity.css?v=3.9.48"><link rel="stylesheet" href="/modules/workspace.css?v=3.9.48"><link rel="manifest" href="/manifest.webmanifest?v=3.9.48">
<link rel="stylesheet" href="/modules/usage.css?v=3.9.48"><link rel="stylesheet" href="/modules/look-bold.css?v=3.9.48"></head>
<body>
<div class="ios-status-strip" aria-hidden="true"></div>
<aside id="workspace-sidebar">
  <header class="workspace-brand-row">
    <button id="workspace-refresh" class="btn workspace-identity" type="button" title="Refresh" data-workspace-title="refresh"><span class="workspace-logo" aria-hidden="true"></span><strong>Stepsemble</strong></button>
    <button id="workspace-sidebar-close" class="btn ghost workspace-icon-btn workspace-mobile-nav" aria-label="Hide workspace list" data-workspace-aria-label="hideSidebar">×</button>
  </header>
  <section id="workspace-assistant" class="workspace-assistant" aria-live="polite" hidden></section>
  <section class="workspace-host-block">
    <label class="workspace-host-card">
      <span class="workspace-host-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2.5"/><path d="M9 20h6M12 16.5V20"/></svg><span class="workspace-status-dot"></span></span>
      <select id="workspace-host" aria-label="Host" data-workspace-aria-label="host"></select>
      <span id="workspace-host-state" class="workspace-host-state" aria-hidden="true"></span>
      <svg class="workspace-host-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4"/></svg>
    </label>
    <span id="workspace-connection" class="workspace-sr-only" role="status"></span>
  </section>
  <div class="workspace-search-row">
    <label class="workspace-search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="workspace-search" type="search" placeholder="Search sessions" aria-label="Search workspace sessions" data-workspace-placeholder="searchSessions" data-workspace-aria-label="searchWorkspace"></label>
    <button id="workspace-automations" class="btn workspace-row-action" type="button" title="Automations" aria-label="Automations" aria-haspopup="dialog" aria-expanded="false" data-workspace-title="automations" data-workspace-aria-label="automations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2.8 5.6 13.1h5.6l-.9 8.1 7.6-10.3h-5.6l.9-8.1z"/></svg><span class="workspace-row-badge" hidden></span></button>
    <button id="workspace-history" class="btn workspace-row-action" type="button" title="History from other apps" aria-label="History from other apps" data-workspace-title="history" data-workspace-aria-label="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10.5L6 20.5V17h-.5A2.5 2.5 0 0 1 4 14.5v-8A2.5 2.5 0 0 1 6.5 4z"/><path d="M12 7.5v3.3l2.6 1.6"/></svg></button>
    <button id="workspace-add" class="btn workspace-row-action" type="button" title="Add project" aria-label="Add project" data-workspace-title="addProject" data-workspace-aria-label="addProject"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="workspace-projects"></div>
  <footer>
    <div id="workspace-usage" class="workspace-limits" role="group" aria-label="Subscription limits" data-workspace-aria-label="quota"><span class="workspace-limits-note" data-workspace-i18n="loadingQuota">Loading limits…</span></div>
  </footer>
</aside>
<main id="workspace-main"><div id="workspace-stage"><div id="workspace-tree"></div><div id="workspace-frames"></div></div></main>
<dialog id="workspace-dialog"><header><h2 id="workspace-dialog-title"></h2><button id="workspace-dialog-close" class="btn ghost" aria-label="Close" data-workspace-aria-label="close">×</button></header><div id="workspace-dialog-body"></div></dialog>
<p id="workspace-toast" role="status" hidden></p>
<script src="/modules/composer-ime.js?v=3.9.48"></script><script src="/modules/usage-data.js?v=3.9.48"></script><script src="/modules/usage-ui.js?v=3.9.48"></script>
<script src="/modules/notifications.js?v=3.9.48"></script><script src="/modules/workspace-i18n.js?v=3.9.48"></script><script src="/modules/workspace-layout.js?v=3.9.48"></script><script src="/modules/workspace-order.js?v=3.9.48"></script><script src="/modules/workspace-reorder.js?v=3.9.48"></script><script src="/modules/agent-identity.js?v=3.9.48"></script><script src="/modules/workflows-i18n.js?v=3.9.48"></script><script src="/modules/workflows-ui.js?v=3.9.48"></script><script src="/modules/assistant-i18n.js?v=3.9.48"></script><script src="/modules/assistant-avatars.js?v=3.9.48"></script><script src="/modules/assistant-api.js?v=3.9.48"></script><script src="/modules/assistant-model.js?v=3.9.48"></script><script src="/modules/assistant-navigation.js?v=3.9.48"></script><script src="/modules/assistant-media.js?v=3.9.48"></script><script src="/modules/workspace-assistant-model.js?v=3.9.48"></script><script src="/modules/workspace-assistant.js?v=3.9.48"></script><script src="/modules/workspace-automations.js?v=3.9.48"></script><script src="/modules/workspace.js?v=3.9.48"></script>
</body></html>
