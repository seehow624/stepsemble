<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stepsemble · Workspace</title><script src="/modules/workspace-mobile.js?v=3.1.0-rc.11"></script><link rel="icon" href="/icon-32.png?v=3.1.0-rc.11"><link rel="stylesheet" href="/style.css?v=3.1.0-rc.11"><link rel="stylesheet" href="/modules/workspace.css?v=3.1.0-rc.11"><link rel="manifest" href="/manifest.webmanifest?v=3.1.0-rc.11">
</head>
<body>
<aside id="workspace-sidebar">
  <header class="workspace-brand-row">
    <div class="workspace-identity" aria-label="Stepsemble"><span class="workspace-logo" aria-hidden="true"></span><strong>Stepsemble</strong></div>
    <button id="workspace-sidebar-close" class="btn ghost workspace-icon-btn workspace-mobile-nav" aria-label="Hide workspace list" data-workspace-aria-label="hideSidebar">×</button>
    <button id="workspace-settings" class="btn ghost workspace-icon-btn" title="Settings" aria-label="Settings" data-workspace-title="settings" data-workspace-aria-label="settings">⚙</button>
  </header>
  <section class="workspace-host-block">
    <div class="workspace-section-label"><span data-workspace-i18n="host">Host</span><span class="workspace-status-dot" aria-hidden="true"></span></div>
    <label class="host-label"><select id="workspace-host" aria-label="Host" data-workspace-aria-label="host"></select></label>
  </section>
  <button id="workspace-add" class="btn workspace-add-card" type="button">
    <span class="workspace-add-icon" aria-hidden="true">＋</span>
    <span class="workspace-add-copy"><strong data-workspace-i18n="addProject">Add project</strong></span>
    <span class="workspace-add-arrow" aria-hidden="true">→</span>
  </button>
  <label class="workspace-search-wrap"><span aria-hidden="true">⌕</span><input id="workspace-search" type="search" placeholder="Search workspace sessions" aria-label="Search workspace sessions" data-workspace-placeholder="searchWorkspace" data-workspace-aria-label="searchWorkspace"></label>
  <div id="workspace-projects"></div>
  <footer>
    <button id="workspace-history" class="btn ghost" data-workspace-i18n="history">History from other apps</button>
    <button id="workspace-refresh" class="btn ghost" data-workspace-i18n="refresh">Refresh</button>
    <div class="workspace-section-label"><span data-workspace-i18n="quota">Subscription limits</span></div>
    <button id="workspace-usage" class="btn workspace-limits" title="Subscription limits" data-workspace-title="quota"><span class="workspace-limits-note" data-workspace-i18n="loadingQuota">Loading limits…</span></button>
    <p id="workspace-connection" role="status"></p>
  </footer>
</aside>
<main id="workspace-main"><header class="workspace-heading"><button id="workspace-sidebar-toggle" class="btn ghost workspace-icon-btn" aria-label="Toggle workspace list" data-workspace-aria-label="toggleSidebar">☰</button><div><strong data-workspace-i18n="workspace">Workspace</strong><small data-workspace-i18n="hint">Drag sessions to an edge to split, or to the center to add a tab</small></div><button id="workspace-new-window" class="btn ghost" data-workspace-i18n="newWindow">New window</button></header><div id="workspace-stage"><div id="workspace-tree"></div><div id="workspace-frames"></div></div></main>
<dialog id="workspace-dialog"><header><h2 id="workspace-dialog-title"></h2><button id="workspace-dialog-close" class="btn ghost" aria-label="Close" data-workspace-aria-label="close">×</button></header><div id="workspace-dialog-body"></div></dialog>
<p id="workspace-toast" role="status" hidden></p>
<script src="/modules/workspace-i18n.js?v=3.1.0-rc.11"></script><script src="/modules/workspace-layout.js?v=3.1.0-rc.11"></script><script src="/modules/workspace.js?v=3.1.0-rc.11"></script>
</body></html>
