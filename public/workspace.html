<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Stepsemble · Workspace</title><link rel="icon" href="/icon-32.png?v=3.6.1"><link rel="stylesheet" href="/style.css?v=3.6.1"><link rel="stylesheet" href="/modules/agent-identity.css?v=3.6.1"><link rel="stylesheet" href="/modules/workspace.css?v=3.6.1"><link rel="manifest" href="/manifest.webmanifest?v=3.6.1">
</head>
<body>
<aside id="workspace-sidebar">
  <header class="workspace-brand-row">
    <div class="workspace-identity" aria-label="Stepsemble"><span class="workspace-logo" aria-hidden="true"></span><strong>Stepsemble</strong></div>
    <button id="workspace-sidebar-close" class="btn ghost workspace-icon-btn workspace-mobile-nav" aria-label="Hide workspace list" data-workspace-aria-label="hideSidebar">×</button>
    <button id="workspace-refresh" class="btn ghost workspace-icon-btn" type="button" title="Refresh" aria-label="Refresh" data-workspace-title="refresh" data-workspace-aria-label="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v4h-4M4 17v-4h4M5.6 10a7 7 0 0 1 12.3-2L20 11M4 13l2.1 3a7 7 0 0 0 12.3-2"/></svg></button>
    <button id="workspace-settings" class="btn ghost workspace-icon-btn" title="Settings" aria-label="Settings" data-workspace-title="settings" data-workspace-aria-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2.8-2.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.8-2.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.8 2.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg></button>
  </header>
  <section class="workspace-host-block">
    <div class="workspace-section-label"><span data-workspace-i18n="host">Host</span><span class="workspace-status-dot" aria-hidden="true"></span><span id="workspace-connection" class="workspace-sr-only" role="status"></span></div>
    <label class="host-label"><select id="workspace-host" aria-label="Host" data-workspace-aria-label="host"></select></label>
  </section>
  <div class="workspace-search-row">
    <label class="workspace-search-wrap"><span aria-hidden="true">⌕</span><input id="workspace-search" type="search" placeholder="Search sessions" aria-label="Search workspace sessions" data-workspace-placeholder="searchSessions" data-workspace-aria-label="searchWorkspace"></label>
    <button id="workspace-history" class="btn workspace-search-action" type="button" title="History from other apps" aria-label="History from other apps" data-workspace-title="history" data-workspace-aria-label="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9V4.5H8M4.2 9A8.5 8.5 0 1 1 3.5 12M12 7v5l3.2 2"/></svg></button>
    <button id="workspace-add" class="btn workspace-search-action" type="button" title="Add project" aria-label="Add project" data-workspace-title="addProject" data-workspace-aria-label="addProject"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="workspace-projects"></div>
  <footer>
    <div id="workspace-usage" class="workspace-limits" role="group" aria-label="Subscription limits" data-workspace-aria-label="quota"><span class="workspace-limits-note" data-workspace-i18n="loadingQuota">Loading limits…</span></div>
  </footer>
</aside>
<main id="workspace-main"><div id="workspace-stage"><div id="workspace-tree"></div><div id="workspace-frames"></div></div></main>
<dialog id="workspace-dialog"><header><h2 id="workspace-dialog-title"></h2><button id="workspace-dialog-close" class="btn ghost" aria-label="Close" data-workspace-aria-label="close">×</button></header><div id="workspace-dialog-body"></div></dialog>
<p id="workspace-toast" role="status" hidden></p>
<script src="/modules/workspace-i18n.js?v=3.6.1"></script><script src="/modules/workspace-layout.js?v=3.6.1"></script><script src="/modules/agent-identity.js?v=3.6.1"></script><script src="/modules/workspace.js?v=3.6.1"></script>
