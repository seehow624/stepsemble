<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n-key="history.title">唯讀歷史 · Stepsemble</title>
  <link rel="icon" href="/stepsemble-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/history-preview.css?v=3.0.21">
  <link rel="stylesheet" href="/modules/agent-identity.css?v=3.0.21">
  <script defer src="/modules/agent-identity.js?v=3.0.21"></script>
  <script defer src="/modules/history-i18n.js?v=3.0.21"></script>
  <script defer src="/i18n.js?v=3.0.21"></script>
  <script defer src="/modules/projection.js?v=3.0.21"></script>
  <script defer src="/modules/claude-history-value.js?v=3.0.21"></script>
  <script defer src="/modules/claude-history.js?v=3.0.21"></script>
  <script defer src="/modules/codex-history-records.js?v=3.0.21"></script>
  <script defer src="/modules/history-pages.js?v=3.0.21"></script>
  <script defer src="/modules/history-transport.js?v=3.0.21"></script>
  <script defer src="/modules/history-sources.js?v=3.0.21"></script>
  <script defer src="/modules/codex-history-view.js?v=3.0.21"></script>
  <script defer src="/modules/history-view.js?v=3.0.21"></script>
</head>
<body data-i18n-keyed-only>
  <header class="preview-header">
    <img class="preview-mark" src="/stepsemble-mark.svg" alt="Stepsemble" width="40" height="40">
    <a class="history-home" href="/" data-i18n-key="history.home">返回工作區</a><span class="preview-badge" data-i18n-key="history.badge">唯讀 · 試用</span>
    <div class="history-language">
      <label><span data-i18n-key="history.language">語言</span><select id="history-language" data-history-language aria-describedby="history-language-note"></select></label>
      <p id="history-language-note" data-i18n-key="history.languageNote">只套用此頁，不更改工作區的語言設定。</p>
    </div>
  </header>
  <main>
    <div class="preview-intro">
      <p class="preview-eyebrow" data-history-host-label>STEPSEMBLE HISTORY</p>
      <h1 data-i18n-key="history.heading">回看脈絡，保持唯讀。</h1>
      <p data-i18n-key="history.multiAgentIntro">只顯示主機管理者明確啟用、且目前登入獲准讀取的原生歷史。</p>
      <p class="preview-authority" data-i18n-key="history.authority">來源未認證 · 唯讀觀測 · 不具核准、執行或續跑權限</p>
    </div>
    <div data-history-host><p class="history-empty" role="status" data-i18n-key="history.preparing">準備唯讀歷史…</p></div>
    <noscript data-i18n-key="history.noscript">請開啟 JavaScript 以使用唯讀歷史。</noscript>
  </main>
  <footer data-i18n-key="history.footer">不修改原生歷史、登入或模型路由。工具與附件只以文字呈現。關閉此頁不會中止原生工作。主機若尚未設定此功能，會保留停用狀態。</footer>
</body>
</html>
