<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>唯讀歷史 · Stepsemble</title>
  <link rel="icon" href="/stepsemble-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/history-preview.css?v=3.0.7-rc.6">
  <link rel="stylesheet" href="/modules/agent-identity.css?v=3.0.7-rc.6">
  <script defer src="/modules/agent-identity.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/projection.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/claude-history-value.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/claude-history.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/history-pages.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/history-transport.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/history-sources.js?v=3.0.7-rc.6"></script>
  <script defer src="/modules/history-view.js?v=3.0.7-rc.6"></script>
</head>
<body>
  <header class="preview-header">
    <img class="preview-mark" src="/stepsemble-mark.svg" alt="Stepsemble" width="40" height="40">
    <a class="history-home" href="/">返回工作區</a><span class="preview-badge">唯讀 · 試用</span>
  </header>
  <main>
    <div class="preview-intro">
      <p class="preview-eyebrow" data-history-host-label>CLAUDE HISTORY</p>
      <h1>回看脈絡，保持唯讀。</h1>
      <p>只顯示主機管理者已登記、且目前登入獲准讀取的 Claude 歷史。</p>
      <p class="preview-authority">來源未認證 · 唯讀觀測 · 不具核准、執行或續跑權限</p>
    </div>
    <div data-history-host><p class="history-empty" role="status">正在準備唯讀檢視…</p></div>
    <noscript>請開啟 JavaScript 以使用唯讀歷史。</noscript>
  </main>
  <footer>不修改原生歷史、登入或模型路由。工具與附件只以文字呈現。關閉此頁不會中止原生工作。主機若尚未設定此功能，會保留停用狀態。</footer>
</body>
</html>
