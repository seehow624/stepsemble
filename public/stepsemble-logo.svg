<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Stepsemble</title>
  <desc id="desc">Four equal agent modules move in a shared step rhythm, each revealing the same violet coordination layer.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="44%" r="76%">
      <stop offset="0" stop-color="#20232B"/>
      <stop offset="1" stop-color="#111318"/>
    </radialGradient>
    <linearGradient id="ivory" x1="16%" y1="8%" x2="84%" y2="92%">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F0E9DE"/>
    </linearGradient>
    <linearGradient id="protocol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8588FF"/>
      <stop offset="1" stop-color="#6266EA"/>
    </linearGradient>
    <filter id="mark-shadow" x="-12%" y="-12%" width="124%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <g id="agent-module">
      <!-- The protocol shape deliberately overlaps beneath the ivory shape: it is an attached inset, never a floating piece. -->
      <path data-role="coordination-inset" data-attachment="overlap" fill="url(#protocol)" d="M390 287c-38 18-61 44-68 76h34c6-21 23-38 49-50 22-11 38-26 47-44-16 9-36 15-62 18Z"/>
      <path fill="url(#ivory)" d="M282 100h105c42 0 73 31 73 73v35c0 41-22 69-61 88l-8 4c-31 16-49 37-53 63h-31c-62 0-105-43-105-105v-78c0-49 31-80 80-80Z"/>
    </g>
  </defs>
  <rect width="800" height="800" rx="168" fill="url(#background)"/>
  <g transform="translate(32 32) scale(0.92)" filter="url(#mark-shadow)">
    <use href="#agent-module" transform="translate(-12 -12)"/>
    <g transform="translate(12 -12)"><use href="#agent-module" transform="rotate(90 400 400)"/></g>
    <g transform="translate(12 12)"><use href="#agent-module" transform="rotate(180 400 400)"/></g>
    <g transform="translate(-12 12)"><use href="#agent-module" transform="rotate(270 400 400)"/></g>
  </g>
</svg>
