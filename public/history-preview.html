<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Claude 歷史預覽 · Stepsemble</title>
  <link rel="icon" href="/stepsemble-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/history-preview.css">
  <script defer src="/modules/projection.js"></script>
  <script defer src="/modules/claude-history-value.js"></script>
  <script defer src="/modules/claude-history.js"></script>
  <script defer src="/modules/history-pages.js"></script>
  <script defer src="/modules/history-transport.js"></script>
  <script defer src="/modules/history-view.js"></script>
</head>
<body>
  <header class="preview-header">
    <img class="preview-mark" src="/stepsemble-mark.svg" alt="Stepsemble" width="40" height="40">
    <span>Stepsemble</span><span class="preview-badge">開發預覽</span>
  </header>
  <main>
    <div class="preview-intro">
      <p class="preview-eyebrow">CLAUDE HISTORY</p>
      <h1>回看脈絡，保持唯讀。</h1>
      <p>這是隔離的歷史檢視預覽，目前只提供已測試的合成範例。</p>
      <p class="preview-authority">來源未認證 · 唯讀觀測 · 不具核准、執行或續跑權限</p>
    </div>
    <div data-history-preview><p class="history-empty">正在準備開發預覽…</p></div>
    <noscript>請開啟 JavaScript 以使用唯讀預覽。</noscript>
  </main>
  <footer>此頁不是正式歷史功能，不會讀取你的私人 Claude 紀錄。範例中的工具、附件與指令只以文字呈現。</footer>
</body>
</html>
