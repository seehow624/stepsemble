  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Original separately bounded browser suites plus cold native-reader setup.
    # Keep each worker at five minutes; WebKit has its own job below.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Historical Hosts use Unix native launch; Windows is not silently skipped
      # or claimed by these results. The regular and native Pi matrices cover it.
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Actual pinned release objects, not hand-written old mocks
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Check isolated browser runtime policy
        run: node --test test/rolling-runtime.test.js test/browser-request-barrier.test.mjs
      - name: Build pinned native reader for owned browser fixtures
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-browser-reader
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --manifest-path crates/history-source-reader/Cargo.toml --locked --release --bins --example owned_sqlite_writer
      - name: Test both directions against two shipped releases
        run: npm run test:rolling -- --history-helper="${{ runner.temp }}/stepsemble-browser-reader/release/stepsemble-history-source-reader"

  usage-webkit:
    # Playwright 1.63 uses current WebKit on macOS 15; macOS 14 is frozen.
    # Do not share the original matrix's remaining job time.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Test retained Usage and sheet gestures in WebKit
        timeout-minutes: 5
        shell: bash
        run: |
          umask 022
          runtime="$(mktemp -d "$RUNNER_TEMP/stepsemble-webkit.XXXXXX")"
          cleanup() {
            status=$?
            trap - EXIT
            if ! rm -rf -- "$runtime"; then
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          chmod 700 "$runtime"
          cp scripts/browser-test-runtime/package.json scripts/browser-test-runtime/package-lock.json "$runtime/"
          touch "$runtime/user.npmrc" "$runtime/global.npmrc"
          export HOME="$runtime" USERPROFILE="$runtime"
          export XDG_CONFIG_HOME="$runtime/.config" XDG_CACHE_HOME="$runtime/.cache"
          export PLAYWRIGHT_BROWSERS_PATH="$runtime/browsers" STEPSEMBLE_USAGE_PRICING_NETWORK=0
          node --input-type=module - "$runtime" <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";
          import { validateBrowserLock } from "./scripts/check-rolling-clients.mjs";
          const runtime = process.argv[2];
          validateBrowserLock(JSON.parse(await fs.readFile(path.join(runtime, "package.json"), "utf8")),
            JSON.parse(await fs.readFile(path.join(runtime, "package-lock.json"), "utf8")));
          NODE
          npm ci --prefix="$runtime" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ \
            --userconfig="$runtime/user.npmrc" --globalconfig="$runtime/global.npmrc" --cache="$runtime/npm-cache"
          node "$runtime/node_modules/playwright/cli.js" install webkit
          node --input-type=module - "$runtime" <<'NODE'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { cleanEnvironment } from "./scripts/check-rolling-clients.mjs";
          import { runUsageBrowserCases } from "./scripts/usage-browser-cases.mjs";
          const runtime = process.argv[2];
          const { webkit } = await import(pathToFileURL(path.join(runtime, "node_modules/playwright/index.mjs")));
          const browser = await webkit.launch({ headless: true, env: cleanEnvironment(runtime) });
          try {
            console.log(JSON.stringify({ browserEngine: browser.browserType().name(), browserVersion: browser.version() }));
            await runUsageBrowserCases(browser);
          }
          finally { await browser.close(); }
          NODE
