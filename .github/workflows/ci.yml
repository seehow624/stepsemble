name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Validate macOS shell scripts
        if: runner.os == 'macOS'
        run: zsh -n install.sh uninstall.sh deploy/*.sh macos/*.sh
      - name: Build, sign, and start the macOS app
        if: runner.os == 'macOS'
        run: |
          app_dir="$RUNNER_TEMP/macos-app"
          macos/build-app.sh "$app_dir/Stepsemble.app"
          lipo "$app_dir/Stepsemble.app/Contents/MacOS/Stepsemble" -verify_arch arm64 x86_64
          export STEPSEMBLE_APP_PATH="$RUNNER_TEMP/signed/Applications/Stepsemble.app"
          export STEPSEMBLE_APP_SUPPORT_DIR="$RUNNER_TEMP/signed/Support/Stepsemble"
          keychains="$(security list-keychains -d user)"
          zsh deploy/stepsemble-macos-app.sh install "$app_dir/Stepsemble.app"
          test "$(security list-keychains -d user)" = "$keychains"
          zsh deploy/stepsemble-macos-app.sh check "$(node -p 'require("./package.json").version')"
          codesign -d -r- "$STEPSEMBLE_APP_PATH" 2>&1 | grep 'identifier "com.stepsemble.app" and certificate leaf' > /dev/null
          sed -e "s|__USER__|$USER|g" -e "s|__NODE__|$(command -v node)|g" -e 's|__PIBIN__||g' -e 's|__PORT__|3140|g' \
            -e 's|__TOKEN_FILE__|/tmp/token|g' deploy/com.stepsemble.server.plist > "$RUNNER_TEMP/server.plist"
          zsh deploy/stepsemble-macos-app.sh use-app "$RUNNER_TEMP/server.plist"
          test "$(zsh deploy/stepsemble-macos-app.sh launch-mode "$RUNNER_TEMP/server.plist")" = app
          zsh deploy/stepsemble-macos-app.sh use-node "$RUNNER_TEMP/server.plist"
          test "$(zsh deploy/stepsemble-macos-app.sh launch-mode "$RUNNER_TEMP/server.plist")" = node
          "$STEPSEMBLE_APP_PATH/Contents/MacOS/Stepsemble" --serve "$(command -v node)" \
            -e 'process.exit(process.env.STEPSEMBLE_APP_BUNDLE === process.env.STEPSEMBLE_APP_PATH ? 7 : 1)' || test $? -eq 7
      - name: Validate Linux installer
        if: runner.os == 'Linux'
        run: bash -n install-linux.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '$null = [scriptblock]::Create((Get-Content -Raw ./install-windows.ps1))'
      - name: Check JavaScript
        run: npm run check
      - name: Check native composer entry points
        run: npm run check:native:composer
      - name: Check typed client and generated artifact
        run: npm run check:client
      - name: Check canonical protocol artifact
        run: npm run check:protocol
      - name: Independent protocol schema conformance
        run: npm run check:protocol:conformance
      - name: Run tests
        run: npm test
