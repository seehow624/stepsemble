name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Validate shell scripts
        run: zsh -n install.sh uninstall.sh deploy/*.sh
      - name: Check JavaScript
        run: npm run check
      - name: Run tests
        run: npm test

