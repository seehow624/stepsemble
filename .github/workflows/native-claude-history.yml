name: Native Claude history contract

on:
  push:
    branches: [master]
    paths:
      - 'scripts/check-native-claude-history.mjs'
      - 'scripts/check-history-access.mjs'
      - 'scripts/build-client.mjs'
      - 'scripts/history-preview-server.mjs'
      - 'server/history-*.js'
      - 'protocol/native/claude/**'
      - 'public/modules/projection.js'
      - 'client/history-pages.ts'
      - 'client/history-transport.ts'
      - 'client/history-view.ts'
      - 'client/claude-history*.ts'
      - 'public/modules/history-pages.js'
      - 'public/modules/history-transport.js'
      - 'public/modules/history-view.js'
      - 'public/history-preview.*'
      - 'test/history-http.test.js'
      - 'test/history-transport.test.js'
      - 'test/history-relay.test.js'
      - 'test/history-identity.test.js'
      - 'test/history-preview.test.js'
      - 'test/history-view.test.js'
      - 'test/claude-history-registry.test.js'
      - 'test/claude-history-sdk-loader.test.js'
      - 'public/modules/claude-history*.js'
      - 'test/history-pages.test.js'
      - 'test/claude-history-provider.test.js'
      - 'test/claude-history-observation.test.js'
      - 'test/claude-history-source.test.js'
      - 'test/claude-history-ancillary.test.js'
      - 'test/claude-history-worker.test.js'
      - 'test/claude-history-selection.test.js'
      - 'test/claude-history-version.test.js'
      - '.github/workflows/native-claude-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Pinned offline SDK history readback (no native CLI or model)
        run: node scripts/check-native-claude-history.mjs --download
