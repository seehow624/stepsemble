name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Validate version and test
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          zsh -n install.sh uninstall.sh deploy/*.sh
          npm run check
          npm test
      - name: Build verified source archive
        run: |
          archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="pi-harbor-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" | gzip -9 > "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --generate-notes --title "Pi Harbor ${GITHUB_REF_NAME#v}"
