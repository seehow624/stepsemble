name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Validate version and test
        id: policy
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/release-policy.mjs "$GITHUB_REF_NAME" "$version" >> "$GITHUB_OUTPUT"
          zsh -n install.sh uninstall.sh deploy/*.sh
          npm run check
          npm run check:native:composer
          npm run check:client
          npm run check:protocol
          npm run check:protocol:conformance
          npm test
      - name: Build the macOS app
        id: app
        run: |
          app_dir="$RUNNER_TEMP/macos-app"
          macos/build-app.sh "$app_dir/Stepsemble.app"
          executable="$app_dir/Stepsemble.app/Contents/MacOS/Stepsemble"
          lipo "$executable" -verify_arch arm64 x86_64
          test "$("$executable" --version)" = "$(node -p 'require("./package.json").version')"
          echo "dir=$app_dir" >> "$GITHUB_OUTPUT"
      - name: Build verified source archive
        id: archive
        env:
          APP_DIR: ${{ steps.app.outputs.dir }}
        run: |
          archive="stepsemble-${GITHUB_REF_NAME}.tar.gz"
          release_tar="$RUNNER_TEMP/release.tar"
          git archive --format=tar --prefix="stepsemble-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" > "$release_tar"
          # The macOS app is the one built part of the archive; each Mac signs
          # its own copy when it installs it.
          COPYFILE_DISABLE=1 tar -rf "$release_tar" --no-mac-metadata --uid 0 --gid 0 --uname root --gname root \
            -s ",^Stepsemble.app,stepsemble-${GITHUB_REF_NAME}/macos/Stepsemble.app," -C "$APP_DIR" Stepsemble.app
          gzip -9 < "$release_tar" > "$archive"
          tar -tzf "$archive" | grep -x "stepsemble-${GITHUB_REF_NAME}/macos/Stepsemble.app/Contents/MacOS/Stepsemble" > /dev/null
          STEPSEMBLE_INSTALL_PREFLIGHT_ARCHIVE="$archive" zsh install.sh
          STEPSEMBLE_UPDATE_PREFLIGHT_ARCHIVE="$archive" zsh deploy/stepsemble-update.sh
          shasum -a 256 "$archive" > "$archive.sha256"
          # v2 updaters search for the former asset name first. Publish an
          # identical, independently checksummed alias throughout v3 so an
          # installed v2 host can cross the rename in one update.
          legacy_archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          cp "$archive" "$legacy_archive"
          shasum -a 256 "$legacy_archive" > "$legacy_archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"
          echo "legacy_archive=$legacy_archive" >> "$GITHUB_OUTPUT"
          echo "legacy_checksum=$legacy_archive.sha256" >> "$GITHUB_OUTPUT"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
            ${{ steps.archive.outputs.legacy_archive }}
            ${{ steps.archive.outputs.legacy_checksum }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.policy.outputs.prerelease }}
        run: |
          archive="stepsemble-${GITHUB_REF_NAME}.tar.gz"
          legacy_archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          gh_args=(--verify-tag --generate-notes --title "Stepsemble ${GITHUB_REF_NAME#v}")
          case "$RELEASE_PRERELEASE" in
            true) gh_args+=(--prerelease --latest=false) ;;
            false) ;;
            *) echo "invalid release policy output" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            "$legacy_archive" "$legacy_archive.sha256" \
            "${gh_args[@]}"
