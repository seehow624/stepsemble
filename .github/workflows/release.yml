name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Validate version and test
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          zsh -n install.sh uninstall.sh deploy/*.sh
          npm run check
          npm run check:client
          npm test
      - name: Build verified source archive
        id: archive
        run: |
          archive="stepsemble-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="stepsemble-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" | gzip -9 > "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          # v2 updaters search for the former asset name first. Publish an
          # identical, independently checksummed alias throughout v3 so an
          # installed Pi Harbor host can cross the rename in one update.
          legacy_archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          cp "$archive" "$legacy_archive"
          shasum -a 256 "$legacy_archive" > "$legacy_archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"
          echo "legacy_archive=$legacy_archive" >> "$GITHUB_OUTPUT"
          echo "legacy_checksum=$legacy_archive.sha256" >> "$GITHUB_OUTPUT"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
            ${{ steps.archive.outputs.legacy_archive }}
            ${{ steps.archive.outputs.legacy_checksum }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="stepsemble-${GITHUB_REF_NAME}.tar.gz"
          legacy_archive="pi-harbor-${GITHUB_REF_NAME}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            "$legacy_archive" "$legacy_archive.sha256" \
            --verify-tag --generate-notes --title "Stepsemble ${GITHUB_REF_NAME#v}"
