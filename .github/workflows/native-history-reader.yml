name: Native history reader boundary

on:
  push:
    branches: [master]
    paths:
      - 'crates/history-source-reader/**'
      - 'rust-toolchain.toml'
      - 'scripts/check-native-history-reader.mjs'
      - 'server/native-history-reader*.js'
      - 'protocol/native/claude/native-history-reader*.js'
      - 'protocol/native/claude/history-native-helper.js'
      - 'test/native-history-reader*.test.js'
      - 'test/claude-history-native-helper.test.mjs'
      - 'docs/native-history-reader.md'
      - '.github/workflows/native-history-reader.yml'
  pull_request:
    paths:
      - 'crates/history-source-reader/**'
      - 'rust-toolchain.toml'
      - 'scripts/check-native-history-reader.mjs'
      - 'server/native-history-reader*.js'
      - 'protocol/native/claude/native-history-reader*.js'
      - 'protocol/native/claude/history-native-helper.js'
      - 'test/native-history-reader*.test.js'
      - 'test/claude-history-native-helper.test.mjs'
      - 'docs/native-history-reader.md'
      - '.github/workflows/native-history-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install exact Rust toolchain and lint components
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Record exact toolchain
        run: rustc +1.97.1 --version --verbose
      - name: Check formatting
        run: cargo +1.97.1 fmt --manifest-path crates/history-source-reader/Cargo.toml --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo +1.97.1 clippy --manifest-path crates/history-source-reader/Cargo.toml --locked --all-targets -- -D warnings
      - name: Locked helper tests (Windows reader remains unsupported)
        run: cargo +1.97.1 test --manifest-path crates/history-source-reader/Cargo.toml --locked --all-targets
      - name: Locked standalone helper build
        run: cargo +1.97.1 build --manifest-path crates/history-source-reader/Cargo.toml --locked
      - name: Actual Node to Rust synthetic boundary (no native account or model)
        run: node scripts/check-native-history-reader.mjs
      - name: Node helper transport negative cases
        run: node --test --test-timeout=60000 test/claude-history-native-helper.test.mjs
