name: Native history reader boundary

on:
  push:
    branches: [master]
    paths:
      - 'crates/history-source-reader/**'
      - 'rust-toolchain.toml'
      - 'scripts/check-native-history-reader.mjs'
      - 'scripts/check-native-codex-source.mjs'
      - 'scripts/check-native-codex-pipeline.mjs'
      - 'protocol/native/codex/**'
      - 'test/native-codex-*.test.js'
      - 'scripts/check-native-history-dependencies.mjs'
      - 'scripts/check-native-history-pipeline.mjs'
      - 'scripts/check-native-claude-history.mjs'
      - 'scripts/check-history-access.mjs'
      - 'scripts/history-preview-server.mjs'
      - 'scripts/history-host-synthetic.mjs'
      - 'scripts/check-history-host-native.mjs'
      - 'scripts/history-config.mjs'
      - 'scripts/history-setup.mjs'
      - 'test/history-setup.test.mjs'
      - 'test/history-config.test.mjs'
      - 'server.js'
      - 'public/history.html'
      - 'scripts/build-client.mjs'
      - 'server/history-*.js'
      - 'protocol/native/claude/**'
      - 'client/claude-history*.ts'
      - 'client/history-*.ts'
      - 'public/modules/claude-history*.js'
      - 'public/modules/history-*.js'
      - 'public/modules/projection.js'
      - 'test/claude-history*.test.*'
      - 'test/history-*.test.js'
      - 'docs/native-history-reader.md'
      - '.github/workflows/native-history-reader.yml'
  pull_request:
    paths:
      - 'crates/history-source-reader/**'
      - 'rust-toolchain.toml'
      - 'scripts/check-native-history-reader.mjs'
      - 'scripts/check-native-codex-source.mjs'
      - 'scripts/check-native-codex-pipeline.mjs'
      - 'protocol/native/codex/**'
      - 'test/native-codex-*.test.js'
      - 'scripts/check-native-history-dependencies.mjs'
      - 'scripts/check-native-history-pipeline.mjs'
      - 'scripts/check-native-claude-history.mjs'
      - 'scripts/check-history-access.mjs'
      - 'scripts/history-preview-server.mjs'
      - 'scripts/history-host-synthetic.mjs'
      - 'scripts/check-history-host-native.mjs'
      - 'scripts/history-config.mjs'
      - 'scripts/history-setup.mjs'
      - 'test/history-setup.test.mjs'
      - 'test/history-config.test.mjs'
      - 'server.js'
      - 'public/history.html'
      - 'scripts/build-client.mjs'
      - 'server/history-*.js'
      - 'protocol/native/claude/**'
      - 'client/claude-history*.ts'
      - 'client/history-*.ts'
      - 'public/modules/claude-history*.js'
      - 'public/modules/history-*.js'
      - 'public/modules/projection.js'
      - 'test/claude-history*.test.*'
      - 'test/history-*.test.js'
      - 'docs/native-history-reader.md'
      - '.github/workflows/native-history-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: RustSec locked dependencies (Linux only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install exact audit tool into runner temporary storage
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 install cargo-audit --version '=0.22.2' --locked \
            --root "${{ runner.temp }}/history-audit-tool" \
            --target-dir "${{ runner.temp }}/history-audit-build"
      - name: Fetch official RustSec database into runner temporary storage
        run: git clone --depth 1 https://github.com/RustSec/advisory-db.git "${{ runner.temp }}/history-advisory-db"
      - name: Audit without ignores and print exact DB and lockfile hashes
        run: >-
          node scripts/check-native-history-dependencies.mjs
          "${{ runner.temp }}/history-audit-tool/bin/cargo-audit"
          "${{ runner.temp }}/history-advisory-db"
          "${{ runner.temp }}"

  reader:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install exact Rust toolchain and lint components
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Record exact toolchain
        run: rustc +1.97.1 --version --verbose
      - name: Check formatting
        run: cargo +1.97.1 fmt --manifest-path crates/history-source-reader/Cargo.toml --all -- --check
      - name: Clippy (warnings are errors)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: cargo +1.97.1 clippy --manifest-path crates/history-source-reader/Cargo.toml --locked --all-targets -- -D warnings
      - name: Locked helper tests (Windows reader remains unsupported)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: cargo +1.97.1 test --manifest-path crates/history-source-reader/Cargo.toml --locked --all-targets
      - name: Locked standalone helper build
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: cargo +1.97.1 build --manifest-path crates/history-source-reader/Cargo.toml --locked
      - name: Actual Node to Rust synthetic boundary (no native account or model)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: node scripts/check-native-history-reader.mjs
      - name: Actual Rust, pinned SDK, Codex parser and shared admission (owned sources only)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: node scripts/check-native-history-pipeline.mjs --download
      - name: Actual Codex selected pair capture to raw pages (owned sources only)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stepsemble-native-history-reader
        run: node scripts/check-native-codex-source.mjs
      - name: Node helper and bytes-only service negative cases
        run: node --test --test-timeout=60000 test/claude-history-native-helper.test.mjs test/claude-history-inventory.test.js test/claude-history-admission.test.js test/claude-history-bytes-worker.test.js test/claude-history-metadata.test.js test/claude-history-native-service.test.js test/native-codex-source.test.js test/native-codex-name-index.test.js test/native-codex-parser-worker.test.js test/native-codex-history-pipeline.test.js test/native-codex-metadata-name.test.js
