[package]
name = "stepsemble-history-source-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Standalone, bounded read-only history source capability experiment"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
# The current crates.io bundle is SQLite 3.53.2. Pin the upstream SQLite 3.53.4
# update (verified against sqlite.org's amalgamation SHA3) instead of using it.
rusqlite = { git = "https://github.com/rusqlite/rusqlite.git", rev = "901f9946efdaaa289e6b1c5bd56dc67f4b651e51", default-features = false, features = ["bundled", "hooks", "limits"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"

# Owned, isolated cross-process SQLite behavior gate, not a shipped reader CLI.
[[test]]
name = "sqlite_wal_process"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
